kind = "web"
previewPath = "/"
title = "Portal do Nutricionista"
version = "1.0.0"
id = "artifacts/nutri-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19949
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/nutri-portal run dev"

[services.env]
PORT = "19949"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/nutri-portal", "run", "build"]
publicDir = "artifacts/nutri-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
